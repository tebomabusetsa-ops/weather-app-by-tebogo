<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="weather-app">

        <header>
            <form id="search-form">
                <input type="search" placeholder="Enter a city" id="search-input" required />
                <input type="submit" value="Search" id="search-button" />
            </form>
        </header>

        <main>

            <div class="weather-data">

                <div>
                    <h1 id="city">Rustenburg</h1>

                    <p>
                    <span id="time"></span>,
                    <span id="description"></span>
                        <br />
                        Humidity:
                        <strong><span id="humidity">100</span>%</strong>,
                        Wind:
                        <strong><span id="wind">42</span> km/h</strong>
                    </p>
                </div>

                <div class="weather-temperature">
                <img class="weather-icon" id="icon" src="" alt="Weather icon">

                    <span class="temperature" id="temperature">22</span>

                    <span class="unit">°C</span>
                </div>

            </div>

        <div class="forecast" id="forecast"></div>

        </main>

        <footer>
            This project was coded by
            <a href="https://github.com/yourusername" target="_blank">
                Tebogo Mabusetsa
            </a>
            ❤️ and is open-sourced on
            <a href="https://github.com/yourusername/weather-app" target="_blank">
                GitHub
            </a>
            and hosted on
            <a href="https://your-app.netlify.app" target="_blank">
                Netlify
            </a>
        </footer>

    </div>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="index.js"></script>
</body>

</html>
