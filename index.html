<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="weather-app">

        <header>
            <form id="search-form">
                <input type="search" placeholder="Enter a city" id="search-input" required />
                <input type="submit" value="Search" id="search-button" />
            </form>
        </header>

        <main>

            <div class="weather-data">

                <div>
                    <h1 id="city">Rustenburg</h1>

                    <p>
                        Tuesday 13:00, rainy day
                        <br />
                        Humidity:
                        <strong>100%</strong>,
                        Wind:
                        <strong>42km/h</strong>
                    </p>
                </div>

                <div class="weather-temperature">
                    <span class="weather-icon">🌧️</span>

                    <span class="temperature">22</span>

                    <span class="unit">°C</span>
                </div>

            </div>

            <div class="forecast">

                <div class="forecast-day">
                    <div>Mon</div>
                    <div>🌧️</div>
                    <div><strong>16°C</strong> - 17°C</div>
                </div>

                <div class="forecast-day">
                    <div>Tue</div>
                    <div>☀️</div>
                    <div><strong>24°C</strong> - 25°C</div>
                </div>

                <div class="forecast-day">
                    <div>Wed</div>
                    <div>⛈️</div>
                    <div><strong>14°C</strong> - 15°C</div>
                </div>

                <div class="forecast-day">
                    <div>Thu</div>
                    <div>🌤️</div>
                    <div><strong>22°C</strong> - 23°C</div>
                </div>

                <div class="forecast-day">
                    <div>Fri</div>
                    <div>🌦️</div>
                    <div><strong>19°C</strong> - 19°C</div>
                </div>

            </div>

        </main>

        <footer>
            This project was coded by
            <a href="https://github.com/yourusername" target="_blank">
                Tebogo Mabusetsa
            </a>
            ❤️ and is open-sourced on
            <a href="https://github.com/yourusername/weather-app" target="_blank">
                GitHub
            </a>
            and hosted on
            <a href="https://your-app.netlify.app" target="_blank">
                Netlify
            </a>
        </footer>

    </div>

    <script src="index.js"></script>

</body>

</html>
