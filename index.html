<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <form>
        <input type="search" placeholder="Enter a city" />
        <button>Search</button>
    </form>

    <h1 id="current-city">Rustenburg</h1>

    <p>
        <span id="current-date">Sunday 15:24</span>,
        <span id="weather-description">Broken clouds</span>
        <br>
        Humidity: <strong id="humidity">68%</strong>,
        Wind: <strong id="wind-speed">2.95 km/h</strong>
    </p>

    <div class="current-weather">
        <img id="weather-icon" src="https://shecodes-assets.s3.amazonaws.com/api/weather/icons/clear-sky-day.png"
            alt="Weather icon" />

        <h2 id="current-temperature">24°C</h2>
    </div>

    <div class="forecast">

        <div class="forecast-day">
            <p>Mon</p>
            <img src="" alt="">
            <p>25°</p>
            <p>18°</p>
        </div>

        <div class="forecast-day">
            <p>Tue</p>
            <img src="" alt="">
            <p>23°</p>
            <p>17°</p>
        </div>

        <div class="forecast-day">
            <p>Wed</p>
            <img src="" alt="">
            <p>20°</p>
            <p>15°</p>
        </div>

        <div class="forecast-day">
            <p>Thu</p>
            <img src="" alt="">
            <p>26°</p>
            <p>19°</p>
        </div>

        <div class="forecast-day">
            <p>Fri</p>
            <img src="" alt="">
            <p>24°</p>
            <p>18°</p>
        </div>

    </div>

    <footer>
        This project was coded by Tebogo Mabusetsa and is open-sourced on GitHub and hosted on Netlify.
    </footer>

</body>

</html>
